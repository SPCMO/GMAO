<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GMAO{% endblock %} — Matériel hydrométrique</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f4f5f7; color: #1a1a1a; }
  header { background: #14314f; color: #fff; padding: 1rem 1.5rem; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  .header-left { justify-self: start; }
  .header-title { justify-self: center; font-size: 1.05rem; white-space: nowrap; }
  .header-right { justify-self: end; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
  table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid #e5e7eb; }
  th { background: #eef1f5; font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; }
  tr:hover td { background: #f9fafb; }
  .btn { display: inline-block; background: #14314f; color: #fff; padding: .5rem 1rem; border-radius: 6px; text-decoration: none; font-size: .9rem; border: none; cursor: pointer; }
  .btn:hover { background: #1d4569; }
  .btn-secondary { background: #6b7280; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: 1rem; flex-wrap: wrap; }
  .toolbar select, .toolbar input { padding: .4rem .6rem; border: 1px solid #d1d5db; border-radius: 6px; }
  form.card { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); max-width: 480px; }
  form.card label { display: block; margin-top: 1rem; font-size: .85rem; font-weight: 600; color: #374151; }
  form.card input, form.card select { width: 100%; padding: .5rem; margin-top: .3rem; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
  .flash { background: #dcfce7; color: #166534; padding: .6rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
  .badge { display: inline-block; background: #e0e7ff; color: #3730a3; padding: .15rem .5rem; border-radius: 999px; font-size: .78rem; }
  .muted { color: #6b7280; font-size: .85rem; }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary" title="Accueil">🏠 Accueil</a>
  </div>
  <div class="header-title">GMAO — Matériel hydrométrique</div>
  <div class="header-right">
    <a href="{{ url_for('aide') }}" class="btn btn-secondary" title="Aide" target="_blank">📖 Aide</a>
    <a href="{{ url_for('parametres') }}" class="btn btn-secondary" title="Paramètres">⚙️ Paramètres</a>
    <a href="{{ url_for('nouveau_equipement') }}" class="btn">+ Nouvel équipement</a>
  </div>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
